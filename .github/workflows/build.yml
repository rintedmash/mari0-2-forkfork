name: Validate and build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_apk:
        description: "Also build signed Release APKs"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
      - name: Compile Lua source files
        run: |
          while IFS= read -r -d '' file; do
            luajit -b "$file" /dev/null
          done < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)
      - name: Validate default environment
        run: |
          cp environment.example.lua environment.lua
          luajit -e 'local environment = dofile("environment.lua"); assert(type(environment.debug) == "table"); assert(environment.debug.mappack == "world-e"); assert(environment.scale == 3)'
      - name: Run Lua unit tests
        run: luajit -e 'lunatest = require "test.lunatest"; lunatest.suite("test.test_actor_destroy"); lunatest.suite("test.test_controls3"); lunatest.suite("test.test_jumping"); lunatest.suite("test.test_touchcontrols"); lunatest.run()'
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install makelove
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'setuptools<81' 'git+https://github.com/qixils/makelove.git@f11036a88ad75afc6dedc1547dfc3a41dd7496b3'
      - name: Package the LÖVE game
        run: |
          python -m makelove
          cp dist/makelove-build/love/mari0-2.love dist/mari0-2.love
          python - <<'PY'
          import zipfile

          path = "dist/mari0-2.love"
          with zipfile.ZipFile(path) as package:
              files = set(package.namelist())
              required = {"main.lua", "conf.lua", "environment.lua", "controls.lua", "lib/paletteShader.glsl"}
              missing = required - files
              if missing:
                  raise SystemExit(f"The LÖVE package is incomplete: {sorted(missing)}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: mari0-2-love
          path: dist/mari0-2.love
          if-no-files-found: error

  android-apk:
    needs: validate-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mari0-2-love
          path: dist
      - name: Prepare release signing key
        if: inputs.release_apk
        id: relkey
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
          else
            keytool -genkeypair -v -keystore release.keystore -alias mari0-2 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KS_PASS:-mari0-release-key}" \
              -keypass "${KS_PASS:-mari0-release-key}" \
              -dname "CN=Mari0 2, OU=Game, O=Wokitron, C=US"
          fi
          echo "alias=${KS_ALIAS:-mari0-2}" >> "$GITHUB_OUTPUT"
          echo "pass=${KS_PASS:-mari0-release-key}" >> "$GITHUB_OUTPUT"
          echo "b64=$(base64 -w0 release.keystore)" >> "$GITHUB_OUTPUT"
      - name: Build Android APKs with embedded game
        uses: love-actions/love-actions-android@eb670108676c0d37d88e3f67d8e22959bc6ba856
        with:
          app-name: Mari0 2
          bundle-id: com.wokitron.mari02
          resource-path: .github/android/res
          icon-specifier: "@drawable/love"
          love-ref: "11.5"
          love-package: dist/mari0-2.love
          product-name: mari0-2
          version-string: "0.1.${{ github.run_number }}"
          version-code: "${{ github.run_number }}"
          output-folder: dist/android
          keystore-base64: ${{ steps.relkey.outputs.b64 }}
          keystore-alias: ${{ steps.relkey.outputs.alias }}
          keystore-key-password: ${{ steps.relkey.outputs.pass }}
          keystore-store-password: ${{ steps.relkey.outputs.pass }}
      - name: Verify the APKs contain the game, not just the runtime
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          apks = sorted(glob.glob("dist/android/*.apk"))
          if not apks:
              raise SystemExit("No APK was produced")
          required = {"assets/main.lua", "assets/conf.lua", "assets/environment.lua", "assets/lib/paletteShader.glsl"}
          for path in apks:
              with zipfile.ZipFile(path) as apk:
                  missing = required - set(apk.namelist())
                  if missing:
                      raise SystemExit(f"{path} is missing embedded game files: {sorted(missing)}")
              print(f"OK {path}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: mari0-2-android-debug
          path: dist/android/mari0-2-debug.apk
          if-no-files-found: error
      - name: Upload release APK
        if: inputs.release_apk
        uses: actions/upload-artifact@v7
        with:
          name: mari0-2-android-release
          path: dist/android/mari0-2-release*.apk
          if-no-files-found: error
