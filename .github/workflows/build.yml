name: Validate and build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
      - name: Compile Lua source files
        run: |
          while IFS= read -r -d '' file; do
            luajit -b "$file" /dev/null
          done < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)
      - name: Validate default environment
        run: |
          cp environment.example.lua environment.lua
          luajit -e 'local environment = dofile("environment.lua"); assert(type(environment.debug) == "table"); assert(environment.debug.mappack == "world-e"); assert(environment.scale == 3)'
      - name: Run Lua unit tests
        run: luajit -e 'lunatest = require "test.lunatest"; lunatest.suite("test.test_actor_destroy"); lunatest.suite("test.test_controls3"); lunatest.suite("test.test_jumping"); lunatest.suite("test.test_touchcontrols"); lunatest.run()'
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install makelove
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'setuptools<81' 'git+https://github.com/qixils/makelove.git@f11036a88ad75afc6dedc1547dfc3a41dd7496b3'
      - name: Package the LÖVE game
        run: |
          python -m makelove
          cp dist/makelove-build/love/mari0-2.love dist/mari0-2.love
          python - <<'PY'
          import zipfile

          path = "dist/mari0-2.love"
          with zipfile.ZipFile(path) as package:
              files = set(package.namelist())
              required = {"main.lua", "conf.lua", "environment.lua", "controls.lua"}
              missing = required - files
              if missing:
                  raise SystemExit(f"The LÖVE package is incomplete: {sorted(missing)}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: mari0-2-love
          path: dist/mari0-2.love
          if-no-files-found: error

  android-apk:
    needs: validate-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mari0-2-love
          path: dist
      - name: Build Android debug APK with embedded game
        uses: love-actions/love-actions-android@eb670108676c0d37d88e3f67d8e22959bc6ba856
        with:
          app-name: Mari0 2
          bundle-id: com.wokitron.mari02
          resource-path: .github/android/res
          icon-specifier: "@drawable/love"
          love-ref: "11.5"
          love-package: dist/mari0-2.love
          product-name: mari0-2
          version-string: "0.1.${{ github.run_number }}"
          version-code: "${{ github.run_number }}"
          output-folder: dist/android
      - name: Verify the APK contains the game, not just the runtime
        run: |
          python3 - <<'PY'
          import zipfile

          path = "dist/android/mari0-2-debug.apk"
          with zipfile.ZipFile(path) as apk:
              files = set(apk.namelist())
              required = {"assets/main.lua", "assets/conf.lua", "assets/environment.lua"}
              missing = required - files
              if missing:
                  raise SystemExit(f"The APK is missing embedded game files: {sorted(missing)}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: mari0-2-android-debug
          path: dist/android/mari0-2-debug.apk
          if-no-files-found: error

  android-smoke-test:
    needs: android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mari0-2-android-debug
          path: dist/android
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install screenshot verifier
        run: python -m pip install Pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, and exercise the APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash .github/scripts/android-smoke-test.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mari0-2-android-smoke-test
          path: dist/android/smoke/
          if-no-files-found: ignore
